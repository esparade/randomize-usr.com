        const createScene = function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color3(0, 0, 0);

            const cam0 = new BABYLON.ArcRotateCamera("camFar", Math.PI / 2, Math.PI / 2, 115, BABYLON.Vector3.Zero(), scene);
            const cam1 = new BABYLON.ArcRotateCamera("camNear", Math.PI / 1.27, Math.PI / 1.6, 50, new BABYLON.Vector3(-40,7,-10), scene);
            //camera.lowerBetaLimit = 0.2;
            //camera.upperBetaLimit = Math.PI / 1.1;
            //camera.lowerAlphaLimit = -Math.PI / 1.01;
            //camera.upperAlphaLimit = (Math.PI / 2) - 1.6;
            //camera.lowerRadiusLimit = 10;
            //camera.upperRadiusLimit = 300;

            scene.activeCamera = cam0
            cam0.attachControl(canvas, true);

            scene.onKeyboardObservable.add((kbInfo) => { //keyboard switcher
                switch (kbInfo.type) {
                    case BABYLON.KeyboardEventTypes.KEYDOWN:
                        if (kbInfo.event.key === "1") {
                            scene.activeCamera.detachControl(); //camera control reset between cameras
                            scene.activeCamera = cam0;
                            cam0.attachControl(canvas, true); //attach control reseted
                        }
                        if (kbInfo.event.key === "2") {
                            scene.activeCamera.detachControl();
                            scene.activeCamera = cam1;
                            //cam1.attachControl(canvas, true);
                        }
                        break;
                }
            });

            const gl = new BABYLON.GlowLayer("glow", scene, {blurKernelSize: 32});
            gl.intensity = 2.6;

            const matOff = new BABYLON.StandardMaterial("matOff", scene);
            matOff.diffuseColor = new BABYLON.Color3(0, 0, 0);
            matOff.emissiveColor = new BABYLON.Color3(0, 0, 0);

            const matOn = new BABYLON.StandardMaterial("matOn", scene);
            matOn.diffuseColor = new BABYLON.Color3(0, 0, 0);
            matOn.emissiveColor = new BABYLON.Color3(0.35, 0.55, 1);

            var meshesMap = {}; //{"A":[0,1...],"B":[0,1...]...}

            BABYLON.SceneLoader.ImportMesh("", "./", "v3w.glb", scene, function (meshes) {
                meshes.forEach(function(mesh) {
                    let letra = mesh.name.charAt(0);
                    let numero = parseInt(mesh.name.substring(1));

                    if (!meshesMap[letra]) { //creates array for letter if doesnt exist yet
                        meshesMap[letra] = new Array(10);
                    }

                    meshesMap[letra][numero] = mesh; //maps the meshes with the array
                    mesh.material = matOff;
                });
            });

            // ANIM
            var duration = 500;
            var deltaTime = 0;
            var currentIndex = 0;

            function renderAnimStep(frame) {
                //for every mesh we know about, check if it's in this frame
                Object.keys(meshesMap).forEach(function(group) {
                    var element = meshesMap[group];
                    if (!element) return;

                    var askingMask = frame[group]; //undefined if this letter isn't in the frame

                    for (var i = 0; i < 10; i++) {
                        if (!element[i]) continue;

                        if (askingMask !== undefined) {
                            element[i].material = askingMask & (1 << (9 - i)) ? matOn : matOff;
                        } else { //element not in this keyframe, turn off
                            element[i].material = matOff;
                        }
                    }
                });
            }

            scene.registerBeforeRender(function () {
                deltaTime += engine.getDeltaTime();
                var currentStep = lightShow[currentIndex];

                if (currentStep.duration !== undefined) {
                    duration = currentStep.duration;
                } else {
                    duration = 500;
                }

                if (deltaTime > duration) {
                    deltaTime = 0;
                    currentIndex++;
                    if (currentIndex >= lightShow.length) {
                        currentIndex = 0;
                    }

                    renderAnimStep(lightShow[currentIndex]);
                }
            });

            return scene;
        };

        const scene = createScene();
        engine.runRenderLoop(() => scene.render());
        window.addEventListener("resize", () => engine.resize());
